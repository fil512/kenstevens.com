<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ken Stevens</title>
  <meta name="description" content="Ken Stevens">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --link: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --link: #93c5fd;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 0 16px;
    }
    main { text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    a { color: var(--link); text-decoration: none; font-size: 1.1rem; }
    a:hover, a:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Ken Stevens</h1>
    <ul>
      <li><a href="https://github.com/fil512">GitHub</a></li>
    </ul>
  </main>
</body>
</html>
